<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A FlowForge workflow: a webhook trigger fans out to an http task, which feeds a transform task that is currently running and a conditional task that is being retried. Email and delay tasks wait on queued dependencies.">
  <defs>
    <pattern id="ffgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#14171B" stroke-width="1" />
    </pattern>
    <linearGradient id="ffedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.85" />
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <style>
    .ff-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ff-title { font-size: 13px; fill: #8A9099; }
    .ff-dim { font-size: 11px; fill: #5A6069; }
    .ff-node-title { font-size: 14px; fill: #E6E8EB; font-weight: 600; }
    .ff-node-type { font-size: 11px; fill: #5A6069; }
    .ff-node-meta { font-size: 10.5px; }
    .ff-flow { stroke-dasharray: 6 7; animation: ffdash 1.1s linear infinite; }
    .ff-pulse { animation: ffpulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ffdash { to { stroke-dashoffset: -13; } }
    @keyframes ffpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .ff-flow { animation: none; }
      .ff-pulse { animation: none; }
    }
  </style>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#0E1013" stroke="#1F2328" />
  <rect x="0.5" y="56.5" width="1199" height="583" rx="0" fill="url(#ffgrid)" />
  <path d="M0.5 56.5 H1199.5" stroke="#1F2328" />

  <!-- window chrome -->
  <circle cx="30" cy="28" r="5" fill="#5EEAD4" opacity="0.7" />
  <circle cx="50" cy="28" r="5" fill="#2A2F36" />
  <circle cx="70" cy="28" r="5" fill="#2A2F36" />
  <text class="ff-mono ff-title" x="94" y="33">order-fulfillment<tspan fill="#3E454E"> · workflow</tspan></text>

  <g class="ff-mono">
    <rect x="1010" y="14" width="150" height="28" rx="14" fill="#5EEAD4" fill-opacity="0.08" stroke="#134E45" />
    <circle cx="1032" cy="28" r="3.5" fill="#5EEAD4" />
    <text x="1044" y="32" font-size="12" fill="#5EEAD4">v3 · active</text>
  </g>

  <!-- edges -->
  <path d="M206 290 L286 290" fill="none" stroke="#134E45" stroke-width="1.8" />
  <path d="M476 282 C 520 282 520 182 566 182" fill="none" stroke="#134E45" stroke-width="1.8" />
  <path d="M476 298 C 520 298 520 390 566 390" fill="none" stroke="#134E45" stroke-width="1.8" />
  <path d="M756 182 L856 182" fill="none" stroke="#2A2F36" stroke-width="1.8" stroke-dasharray="5 5" />
  <path d="M756 390 L856 390" fill="none" stroke="#2A2F36" stroke-width="1.8" stroke-dasharray="5 5" />

  <!-- live activity travelling into the running task -->
  <path class="ff-flow" d="M476 282 C 520 282 520 182 566 182" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.9" />

  <!-- trigger -->
  <g class="ff-mono">
    <rect x="56" y="260" width="150" height="60" rx="12" fill="#14171B" stroke="#2A2F36" />
    <rect x="56" y="270" width="3" height="40" rx="1.5" fill="#8A9099" />
    <text class="ff-node-title" x="74" y="287">trigger</text>
    <text class="ff-node-type" x="74" y="305">webhook · signed</text>
  </g>

  <!-- fetch · done -->
  <g class="ff-mono">
    <rect x="286" y="256" width="190" height="68" rx="12" fill="#131A18" stroke="#1E6B54" />
    <rect x="286" y="266" width="3" height="48" rx="1.5" fill="#34D399" />
    <text class="ff-node-title" x="304" y="284">fetch</text>
    <text class="ff-node-type" x="304" y="302">http</text>
    <text class="ff-node-meta" x="460" y="284" text-anchor="end" fill="#34D399">w-01a</text>
    <text class="ff-node-meta" x="460" y="302" text-anchor="end" fill="#34D399">412ms</text>
    <circle cx="458" cy="308" r="3.5" fill="#34D399" />
  </g>

  <!-- enrich · running -->
  <g class="ff-mono">
    <rect x="566" y="148" width="190" height="68" rx="12" fill="#131720" stroke="#2563EB" />
    <rect x="566" y="158" width="3" height="48" rx="1.5" fill="#60A5FA" />
    <text class="ff-node-title" x="584" y="176">enrich</text>
    <text class="ff-node-type" x="584" y="194">transform</text>
    <text class="ff-node-meta" x="740" y="176" text-anchor="end" fill="#60A5FA">w-02b</text>
    <text class="ff-node-meta" x="740" y="194" text-anchor="end" fill="#60A5FA">running</text>
    <circle class="ff-pulse" cx="738" cy="200" r="3.5" fill="#60A5FA" />
  </g>

  <!-- validate · retry -->
  <g class="ff-mono">
    <rect x="566" y="356" width="190" height="68" rx="12" fill="#1A1710" stroke="#8A6A16" />
    <rect x="566" y="366" width="3" height="48" rx="1.5" fill="#FBBF24" />
    <text class="ff-node-title" x="584" y="384">validate</text>
    <text class="ff-node-type" x="584" y="402">conditional</text>
    <text class="ff-node-meta" x="740" y="384" text-anchor="end" fill="#FBBF24">attempt 2</text>
    <text class="ff-node-meta" x="740" y="402" text-anchor="end" fill="#FBBF24">backoff 4s</text>
    <circle cx="738" cy="408" r="3.5" fill="#FBBF24" />
  </g>

  <!-- notify · queued -->
  <g class="ff-mono">
    <rect x="856" y="148" width="190" height="68" rx="12" fill="#14171B" stroke="#2A2F36" />
    <rect x="856" y="158" width="3" height="48" rx="1.5" fill="#94A3B8" />
    <text class="ff-node-title" x="874" y="176" fill="#B6BCC6">notify</text>
    <text class="ff-node-type" x="874" y="194">email</text>
    <text class="ff-node-meta" x="1030" y="176" text-anchor="end" fill="#5A6069">queued</text>
    <text class="ff-node-meta" x="1030" y="194" text-anchor="end" fill="#5A6069">waits on enrich</text>
    <circle cx="1028" cy="200" r="3.5" fill="#94A3B8" />
  </g>

  <!-- archive · queued -->
  <g class="ff-mono">
    <rect x="856" y="356" width="190" height="68" rx="12" fill="#14171B" stroke="#2A2F36" />
    <rect x="856" y="366" width="3" height="48" rx="1.5" fill="#94A3B8" />
    <text class="ff-node-title" x="874" y="384" fill="#B6BCC6">archive</text>
    <text class="ff-node-type" x="874" y="402">delay · 1h</text>
    <text class="ff-node-meta" x="1030" y="384" text-anchor="end" fill="#5A6069">queued</text>
    <text class="ff-node-meta" x="1030" y="402" text-anchor="end" fill="#5A6069">waits on validate</text>
    <circle cx="1028" cy="408" r="3.5" fill="#94A3B8" />
  </g>

  <!-- The state legend is rendered as live DOM by the landing page (so it stays
       readable and selectable at every viewport width) rather than duplicated
       here. -->
</svg>
